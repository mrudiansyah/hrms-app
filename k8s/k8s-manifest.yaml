apiVersion: v1
kind: Namespace
metadata:
  name: hrms-app
---
# ==========================================
# 1. NFS Storage for Laravel & MySQL
# ==========================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hrms-storage-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.24
    path: /volume1/laravel-storage
  storageClassName: nfs-hrms
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hrms-storage-pvc
  namespace: hrms-app
spec:
  storageClassName: nfs-hrms
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: hrms-storage-pv
---

# ==========================================
# 3. HRMS Laravel Application Setup
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-app-deploy
  namespace: hrms-app
  annotations:
    deployment-timestamp: "initial"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hrms-app
  template:
    metadata:
      labels:
        app: hrms-app
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: app
        image: mrudiansyah14/hrms-app:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            (chown -R www-data:www-data storage || true) &&
            chown -R www-data:www-data bootstrap/cache &&
            (chmod -R 775 storage || true) &&
            chmod -R 775 bootstrap/cache &&
            echo "memory_limit=2G" > /usr/local/etc/php/conf.d/memory.ini &&
            echo "max_execution_time=600" > /usr/local/etc/php/conf.d/timeout.ini &&
            (php artisan view:clear || true) &&
            (php artisan cache:clear || true) &&
            (php artisan config:clear || true) &&
            (php artisan migrate --force || true) &&
            apache2-foreground
        ports:
        - containerPort: 80
        env:
        - name: APP_NAME
          value: "HRMS"
        - name: APP_ENV
          value: "production"
        - name: APP_KEY
          value: "base64:F/nhN099ffGsA9sUiM/SS0HBVhXpVZRpanIQxhhhG1s="
        - name: APP_DEBUG
          value: "true"
        - name: APP_URL
          value: "https://hrms.summitadyawinsa.co.id"
        - name: TRUSTED_PROXIES
          value: "*"
        # Database Connections - External MS SQL Server
        - name: DB_CONNECTION
          value: "sqlsrv"
        - name: DB_HOST
          value: "192.168.1.4"
        - name: DB_PORT
          value: "1433"
        - name: DB_DATABASE
          value: "db_hrms"
        - name: DB_USERNAME
          value: "hrms"
        - name: DB_PASSWORD
          value: "1nd()n3514"
        # Shared Storage
        volumeMounts:
        - name: storage-volume
          mountPath: /var/www/html/storage
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: hrms-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: hrms-app-service
  namespace: hrms-app
spec:
  selector:
    app: hrms-app
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hrms-app-ingress
  namespace: hrms-app
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  tls:
  - hosts:
    - hrms.summitadyawinsa.co.id
    secretName: factoryhub-tls
  rules:
  - host: hrms.summitadyawinsa.co.id
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hrms-app-service
            port:
              number: 80
---
